### Prefix ###
set -g prefix C-a
bind C-a send-prefix
unbind C-b

### General ###
set -g history-limit 10000
set -g allow-rename off
set -g renumber-windows on
set -g default-terminal "xterm-256color"
set -g mouse on

### Vi Mode ###
setw -g mode-keys vi

### Window / Pane Navigation ###
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

### Splits (same pwd) ###
#unbind '"'
#unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

### Copy Mode / Clipboard (xclip) ###
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M

### Reload Config ###
unbind r
bind r source-file ~/.tmux.conf \; display 'Reloaded tmux config'

# Cyan Theme
set -g pane-border-style fg='#3E4B59'          # Inactive pane border
set -g pane-active-border-style fg='#39BAE6'   # Active pane border (Cyan accent)

set -g status-style bg='#0A0E14',fg='#B3B1AD'  # Status bar background and text
set -g status-left-length 30
set -g status-right-length 150
set -g status-right "#(~/tools/binz/vpnIP_VM.sh) | #(~/Scripts/localip.sh) | #(whoami)@#(hostname)  #[fg=#4D5566] %b %d '%y #[fg=#39BAE6] %l:%M %p "

setw -g window-status-style fg='#4D5566'       # Inactive window text
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-style fg='#39BAE6' # Active window text (Cyan accent)
setw -g window-status-current-format ' #I:#W#F '

set -g clock-mode-colour '#39BAE6'             # Clock color (Cyan)
set -g clock-mode-style 24
